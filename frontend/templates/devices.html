<!DOCTYPE html>
<html>

<head>

<title>Registered Devices</title>

</head>

<body>

<h1>Registered IoT Devices</h1>

<table border="1">

<tr>

<th>ID</th>

<th>Name</th>

<th>Type</th>

<th>IP</th>

<th>MAC</th>

<th>Trust Score</th>

</tr>

{% for device in devices %}

<tr>

<td>{{ device.device_id }}</td>

<td>{{ device.device_name }}</td>

<td>{{ device.device_type }}</td>

<td>{{ device.ip_address }}</td>

<td>{{ device.mac_address }}</td>

<td>{{ device.trust_score }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
